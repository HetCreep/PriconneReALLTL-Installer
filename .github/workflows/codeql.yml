name: CodeQL

# Static-analysis security scanning (CodeQL) for the C# code. Advanced setup (not "default")
# because this is a .NET Framework 4.8 + packages.config (non-SDK) project — CodeQL's autobuild
# can't handle it, so we build it exactly like release.yml (NuGet restore + MSBuild) and let CodeQL
# trace that compile. Complements Dependabot (dependency CVEs) with code-level analysis.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 5 * * 1'   # weekly (Monday) — catch newly-published CodeQL queries

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    # Dependabot PRs run with a read-only GITHUB_TOKEN, so `security-events: write` is downgraded
    # and CodeQL's SARIF upload fails (exit 1). Skip Dependabot PRs — the bumped dependency is still
    # CodeQL-scanned when it merges to master (the push trigger runs with a full token). Human PRs,
    # master pushes, and the weekly schedule are unaffected.
    if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
    runs-on: windows-latest   # .NET Framework needs Windows + MSBuild
    permissions:
      security-events: write   # upload scan results to the Security tab
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual    # we provide the build below (autobuild can't do non-SDK packages.config)
          queries: security-extended   # deep security coverage (incl. all High-severity security queries) WITHOUT the quality/maintainability flood; code-health stays a manual-review job per the scan division of labor

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore packages
        run: nuget restore PriconneReALLTLInstaller.sln

      - name: Build (Release)
        run: msbuild PriconneReALLTLInstaller.sln /p:Configuration=Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

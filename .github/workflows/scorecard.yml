name: OpenSSF Scorecard

# Repo-LEVEL security-posture audit: branch protection, token permissions, pinned dependencies,
# dangerous-workflow patterns, presence of SAST / secret-scanning / signed releases, etc. It
# complements the code-level CodeQL scan and the Dependabot / dependency-review dependency scans
# with a posture scorecard. Results upload to the Security tab.
#
# publish_results=false: the score stays in this repo (not the public OpenSSF API) — flip to true
# and add a badge if/when this fork wants a public score.

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 2'   # weekly (Tuesday)
  push:
    branches: [ master ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to the Security tab
      id-token: write          # OIDC for the (optional) publish step
      contents: read           # checkout + Scorecard reads the repo (job-level perms REPLACE workflow-level, so list it)
      actions: read            # Scorecard reads workflow-run metadata
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a   # v2.4.3 — SHA-pinned (this action has no floating @v2 tag; pinning a security action is best practice)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463   # v4
        with:
          sarif_file: results.sarif

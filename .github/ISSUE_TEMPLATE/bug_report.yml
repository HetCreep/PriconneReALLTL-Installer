name: Bug report
description: Something isn't working in the installer
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug — the guided fields below help us reproduce it quickly.

        For a **security vulnerability** or a **privacy concern**, please use the private links on the previous screen instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: A clear description of the bug — what happened, and what you saw on screen.
      placeholder: e.g. "Update failed at the extract step and the status bar showed a red error."
    validations:
      required: true
  - type: dropdown
    id: tl-source
    attributes:
      label: TL Source selected
      description: Which translation source was active in the app?
      options:
        - English (ImaterialC)
        - ไทย / Thai (PeterkleCG)
        - Tiếng Việt / Vietnamese (NTP335)
        - Not applicable / not sure
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      description: What were you doing when it happened?
      options:
        - Install
        - Update
        - Reinstall
        - Uninstall
        - Launch game
        - Switch TL Source
        - Wrap / restore a launcher shortcut
        - Installer self-update
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it, step by step?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        Enable **Show Logs** in the app and paste the relevant lines. The log file is `ReALLTLInstaller.log` / `ReALLTLAutoUpdater.log` in `%LOCALAPPDATA%\PriconneReALLTLInstaller`. Tokens are auto-redacted from logs, but please double-check before pasting.
      render: text
    validations:
      required: false
  - type: input
    id: installer-version
    attributes:
      label: Installer version
      description: Shown in the bottom-right of the app.
      placeholder: v3.0.7
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: false
  - type: dropdown
    id: launcher
    attributes:
      label: Launcher in use
      options:
        - DMM Game Player (default)
        - DMMGamePlayerFastLauncher
        - PriconneMultiAccountLauncher
        - Not sure
    validations:
      required: false
  - type: input
    id: game-path
    attributes:
      label: Game install path (if relevant)
      placeholder: C:\Users\<you>\priconner
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — screenshots, recent changes, or whether a GitHub token is set.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I checked the pasted log for anything private (the GitHub token is auto-redacted).
          required: true

name: CodeQL

# Static-analysis security scanning (CodeQL) for the C# code. Advanced setup (not "default")
# because this is a .NET Framework 4.8 + packages.config (non-SDK) project — CodeQL's autobuild
# can't handle it, so we build it exactly like release.yml (NuGet restore + MSBuild) and let CodeQL
# trace that compile. Complements Dependabot (dependency CVEs) with code-level analysis.

on:
  push:
    branches: [ master ]
    # Docs/config-only changes don't touch the C# code, so don't spend a Windows build
    # + CodeQL run on them. A push that also changes code (any non-ignored path) still scans;
    # the weekly schedule below always runs a full scan regardless.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    - cron: '23 5 * * 1'   # weekly (Monday) — catch newly-published CodeQL queries (full scan, ignores paths-ignore)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    # Dependabot PRs run with a read-only GITHUB_TOKEN, so `security-events: write` is downgraded
    # and CodeQL's SARIF upload fails (exit 1). Skip Dependabot PRs — the bumped dependency is still
    # CodeQL-scanned when it merges to master (the push trigger runs with a full token). Human PRs,
    # master pushes, and the weekly schedule are unaffected.
    if: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
    runs-on: windows-latest   # .NET Framework needs Windows + MSBuild
    permissions:
      security-events: write   # upload scan results to the Security tab
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81   # v4
        with:
          languages: csharp
          build-mode: manual    # we provide the build below (autobuild can't do non-SDK packages.config)
          queries: security-extended   # deep security coverage (incl. all High-severity security queries) WITHOUT the quality/maintainability flood; code-health stays a manual-review job per the scan division of labor

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57   # v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123   # v4

      - name: Restore packages
        run: nuget restore PriconneReALLTLInstaller.sln

      - name: Build (Release)
        run: msbuild PriconneReALLTLInstaller.sln /p:Configuration=Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81   # v4
        with:
          category: "/language:csharp"

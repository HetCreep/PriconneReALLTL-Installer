name: OpenSSF Scorecard

# Repo-LEVEL security-posture audit: branch protection, token permissions, pinned dependencies,
# dangerous-workflow patterns, presence of SAST / secret-scanning / signed releases, etc. It
# complements the code-level CodeQL scan and the Dependabot / dependency-review dependency scans
# with a posture scorecard. Results upload to the Security tab.
#
# publish_results=false: the score stays in this repo (not the public OpenSSF API) — flip to true
# and add a badge if/when this fork wants a public score.

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 2'   # weekly (Tuesday)
  push:
    branches: [ master ]
    # A docs/config-only push doesn't change the repo's security posture, so skip the audit.
    # The weekly schedule + branch_protection_rule events still catch real posture changes,
    # and a workflow change (not ignored below) still re-runs Scorecard.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.gitattributes'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to the Security tab
      id-token: write          # OIDC for the (optional) publish step
      contents: read           # checkout + Scorecard reads the repo (job-level perms REPLACE workflow-level, so list it)
      actions: read            # Scorecard reads workflow-run metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e   # v2.4.3 — SHA-pinned (this action has no floating @v2 tag; pinning a security action is best practice)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4
        with:
          sarif_file: results.sarif

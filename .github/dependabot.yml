# Dependabot config — keeps dependencies and CI actions current.
# Pairs with the repo's enabled Dependabot security alerts + automated fixes.
#
# Patch/minor bumps auto-merge once the required checks (build + dependency-review) are green
# (.github/workflows/dependabot-auto-merge.yml + the `master-required-checks` ruleset); a major bump in a
# group blocks the whole grouped PR for manual review. `assignees` fires a notification on every PR — the
# maintainer's signal for anything auto-merge left open.
version: 2
updates:
  # NuGet packages (packages.config under the project folder).
  - package-ecosystem: "nuget"
    directory: "/PriconneReALLTLInstaller"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - HetCreep
    # Batch minor + patch bumps into ONE PR (a single build verifies them, less noise);
    # major bumps stay individual so each gets its own review (API-break risk on net48).
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the release + CodeQL + CI workflows (Dependabot bumps the SHA pin and its
  # `# vX` comment together, so the pins in distribution-security stay current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    assignees:
      - HetCreep
    # One PR for all action updates — the CI build verifies them together.
    groups:
      github-actions:
        patterns: ["*"]

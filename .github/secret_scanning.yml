# Secret scanning path exclusions for PriconneReALLTL-Installer.
#
# NOTE: this file does NOT enable secret scanning. The feature is turned on in
#   Settings -> Code security and analysis -> Secret scanning  (+ Push protection)
# This file only narrows WHERE alerts are raised once the feature is on.
#
# Posture: coverage is kept deliberately BROAD. The optional GitHub API token is this
# project's ONLY secret (see .claude/rules/ecc/domain/credential-vault.md), it is stored
# DPAPI-encrypted in user.config OUTSIDE the repo, and it must never be committed. So we
# exclude only paths that (a) cannot legitimately contain that token and (b) would
# otherwise raise false-positive private-key/secret alerts. All first-party source
# (*.cs), workflows, and docs stay fully scanned.
paths-ignore:
  # Strong-name signing key — intentionally committed so CI can strong-name the build.
  # Strong-naming is an identity / anti-collision measure, NOT a trust secret
  # (see distribution-security.md); this key is public by design, not a leak. Excluded
  # so secret scanning does not flag it as a leaked private key.
  - "PriconneReALLTLInstaller/PriconneReALLTLInstaller.snk"

  # Generated / restored build artifacts. These are already gitignored; excluded
  # defensively in case an output is ever force-added. Our source secrets never live here.
  - "**/bin/**"
  - "**/obj/**"
  - "**/packages/**"
